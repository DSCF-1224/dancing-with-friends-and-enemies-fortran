name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fpm
        uses: fortran-lang/setup-fpm@v10

      - name: Build
        run: fpm build --verbose
